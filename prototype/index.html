<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head>
<body>
<title>AlumniConnect</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: LinkedIn-style shell. Sticky top bar, 1128px column; profile = main + 300px rail; phone = bottom tab bar. */
:root{
  --bg:#f2f4f3; --surface:#fff; --surface-2:#eef2f0; --fg:#13201b; --fg-2:#43534c; --muted:#6b7a73;
  --line:#dbe2df; --line-strong:#c2ccc8; --accent:#0d6b5f; --accent-hover:#0a564d; --accent-ink:#fff;
  --accent-soft:#dff0ec; --accent-soft-ink:#0a4f46; --gold:#8f6206; --gold-soft:#f7eed8;
  --ok:#157a3a; --ok-soft:#e2f3e7; --warn:#9a5600; --warn-soft:#fcefd9; --bad:#b8352a; --bad-soft:#fbe5e2;
  --badge-bg:#c4382c; --badge-ink:#fff; --me:#0d6b5f; --me-ink:#fff; --them:#eef2f0;
  --cover:#e3efeb; --cover-line:#cfe1db; --cover-margin:#e2a49a; --cover-ink:#3f6b62;
  --cert-bg:#fffcf3; --cert-line:#d9c48c; --cert-ink:#4b3d15; --scrim:rgba(14,22,19,.45);
  --tip-bg:#13201b; --tip-ink:#f2f4f3; --shadow:0 1px 2px rgba(19,32,27,.06),0 8px 24px rgba(19,32,27,.08);
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#161d1a; --surface-2:#1c2521; --fg:#e5ece9; --fg-2:#b0beb8; --muted:#84928c;
  --line:#29342f; --line-strong:#3a4741; --accent:#4db6a4; --accent-hover:#67c6b5; --accent-ink:#04201b;
  --accent-soft:#173a33; --accent-soft-ink:#93dccd; --gold:#e2b552; --gold-soft:#372d14;
  --ok:#55c97f; --ok-soft:#163222; --warn:#efaa4a; --warn-soft:#382912; --bad:#f08376; --bad-soft:#3b1d1a;
  --badge-bg:#e5675b; --badge-ink:#1c0705; --me:#1f6e62; --me-ink:#ecfaf6; --them:#232d29;
  --cover:#18302a; --cover-line:#20403a; --cover-margin:#7a4a44; --cover-ink:#8fc7bb;
  --cert-bg:#26231a; --cert-line:#6d5b2c; --cert-ink:#eadfbb; --scrim:rgba(0,0,0,.6);
  --tip-bg:#e5ece9; --tip-ink:#0e1412; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#161d1a; --surface-2:#1c2521; --fg:#e5ece9; --fg-2:#b0beb8; --muted:#84928c;
  --line:#29342f; --line-strong:#3a4741; --accent:#4db6a4; --accent-hover:#67c6b5; --accent-ink:#04201b;
  --accent-soft:#173a33; --accent-soft-ink:#93dccd; --gold:#e2b552; --gold-soft:#372d14;
  --ok:#55c97f; --ok-soft:#163222; --warn:#efaa4a; --warn-soft:#382912; --bad:#f08376; --bad-soft:#3b1d1a;
  --badge-bg:#e5675b; --badge-ink:#1c0705; --me:#1f6e62; --me-ink:#ecfaf6; --them:#232d29;
  --cover:#18302a; --cover-line:#20403a; --cover-margin:#7a4a44; --cover-ink:#8fc7bb;
  --cert-bg:#26231a; --cert-line:#6d5b2c; --cert-ink:#eadfbb; --scrim:rgba(0,0,0,.6);
  --tip-bg:#e5ece9; --tip-ink:#0e1412; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance} p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1128px;margin:0 auto;width:100%}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--mono)}
.h2{font:600 20px/1.25 var(--display)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:20px 24px}
.stack{display:grid;gap:16px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ic{flex:none}
/* buttons & chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-p:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-o{border-color:var(--accent);color:var(--accent);background:transparent}
.btn-o:hover{background:var(--accent-soft)}
.btn-g{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn-g:hover{background:var(--surface-2)}
.btn-d{border-color:var(--bad);color:var(--bad);background:transparent}
.btn-sm{height:28px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.link:hover{color:var(--accent);text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line)}
.chip-a{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:transparent}
.chip-g{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.fchip{cursor:pointer;height:30px;padding:0 12px;font-size:13px}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.st{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:2px 8px 2px 6px;border-radius:999px;white-space:nowrap}
.st-ok{background:var(--ok-soft);color:var(--ok)} .st-warn{background:var(--warn-soft);color:var(--warn)} .st-bad{background:var(--bad-soft);color:var(--bad)}
.lv{font:500 11px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:5px;border:1px solid var(--line-strong);color:var(--fg-2);white-space:nowrap}
.lv-hi{border-color:var(--gold);color:var(--gold)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;background:var(--accent-soft);color:var(--accent-soft-ink)}
.av.t2{background:var(--gold-soft);color:var(--gold)}
.av-sm{width:32px;height:32px;font-size:12px} .av-lg{width:64px;height:64px;font-size:22px}
.av-xl{width:120px;height:120px;font:600 40px/1 var(--display);border:4px solid var(--surface)}
input[type=text],input[type=search],input[type=month],input[type=url],select,textarea{width:100%;min-height:38px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:6px 10px}
textarea{min-height:90px;resize:vertical}
.fld{display:grid;gap:6px} .fld label{font-size:13px;font-weight:600}
/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;cursor:pointer;min-width:0;text-align:left}
.crest{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 16px/1 var(--display);flex:none}
.brand b{display:block;font:600 18px/1.1 var(--display)}
.brand span{display:block;font-size:11.5px;color:var(--muted)}
.nav{display:flex;gap:2px;margin-left:auto;height:60px}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:76px;padding:0 6px;border:0;border-bottom:2px solid transparent;background:none;color:var(--fg-2);font-size:12px;cursor:pointer;position:relative}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg)}
.badge{position:absolute;top:6px;left:calc(50% + 4px);min-width:18px;height:18px;border-radius:9px;background:var(--badge-bg);color:var(--badge-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.demo{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;color:var(--fg-2)}
.demo-in{display:flex;align-items:center;gap:10px;min-height:42px;flex-wrap:wrap;padding-block:6px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;background:var(--surface);max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--fg-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.main{padding-block:24px 56px}
/* landing */
.land{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center;padding-block:48px 32px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero-h{font:600 clamp(32px,4.4vw,50px)/1.08 var(--display);letter-spacing:-.015em;margin-top:12px}
.hero-p{font-size:17px;color:var(--fg-2);margin-top:16px;max-width:56ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-block:8px 32px}
.stat{padding:16px 18px} .stat b{display:block;font-size:28px;font-weight:600} .stat span{font-size:13px;color:var(--muted)}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:24px}
.role{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);cursor:pointer}
.role:hover{border-color:var(--accent);background:var(--accent-soft)}
.role b{display:block;font-size:14px} .role span{display:block;font-size:12.5px;color:var(--muted)}
/* people */
.people{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.filters{display:grid;gap:14px;position:sticky;top:84px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:16px}
.pcard{display:flex;flex-direction:column;overflow:hidden}
.pcard-cov{height:52px;background-color:var(--cover);background-image:repeating-linear-gradient(to bottom,transparent 0 13px,var(--cover-line) 13px 14px)}
.pcard-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard-b .av{margin-top:-32px;border:3px solid var(--surface)}
.pcard h3{font:600 18px/1.2 var(--display)}
.pcard .acts{margin-top:auto;padding-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.path{list-style:none;margin:4px 0 0;padding:8px 10px;border-radius:8px;background:var(--surface-2);display:flex;flex-wrap:wrap;gap:3px 6px;font-size:12.5px;color:var(--fg-2)}
.path li+li::before{content:"→";margin-right:6px;color:var(--muted)}
.path i{font:normal 500 11px var(--mono);color:var(--accent)}
/* profile */
.pf{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.cover{height:150px;border-radius:10px 10px 0 0;position:relative;background-color:var(--cover);
  background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--cover-line) 27px 28px),
  linear-gradient(to right,transparent 72px,var(--cover-margin) 72px 73.5px,transparent 73.5px 77px,var(--cover-margin) 77px 78.5px,transparent 78.5px)}
.cover span{position:absolute;right:16px;bottom:10px;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--cover-ink)}
.pf-head{padding:0 24px 24px}
.pf-head .av-xl{margin-top:-64px}
.pf-name{font:600 30px/1.15 var(--display);margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pf-line{font-size:16px;margin-top:4px}
.pf-meta{color:var(--muted);font-size:14px;margin-top:4px}
/* journey */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(108px,1fr);overflow-x:auto;margin-top:16px;border:1px solid var(--line);border-radius:10px}
.seg-y{border:0;border-right:1px solid var(--line);background:none;text-align:left;padding:10px 12px;cursor:pointer;display:grid;gap:4px}
.seg-y:last-child{border-right:0}
.seg-y[aria-pressed="true"]{background:var(--accent-soft)}
.seg-y b{font-size:13px} .seg-y small{font:12px var(--mono);color:var(--muted)}
.dots{display:flex;gap:4px;flex-wrap:wrap;min-height:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.dot.a{background:var(--accent)} .dot.p{background:transparent;border:1.5px solid var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.jgroup{margin-top:18px}
.jlab{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.jlab em{font:normal 12px var(--mono);letter-spacing:0;text-transform:none;margin-left:6px}
.jlist{list-style:none;margin:0;padding:0;position:relative}
.jlist::before{content:"";position:absolute;left:19px;top:10px;bottom:10px;width:2px;background:var(--line)}
.jrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 0;cursor:pointer}
.jrow:hover .jt{color:var(--accent)}
.jico{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line-strong);display:grid;place-items:center;color:var(--fg-2);position:relative;z-index:1}
.is-ach .jico{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.jt{font-weight:600;display:block} .js{color:var(--muted);font-size:13.5px;display:block}
.jtags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.jdet{margin:0 0 8px 52px;padding:14px 16px;border-radius:10px;background:var(--surface-2);display:grid;gap:12px}
.proof{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cert{width:120px;aspect-ratio:1.414/1;background:var(--cert-bg);border:1px solid var(--cert-line);border-radius:4px;display:grid;align-content:center;justify-items:center;gap:3px;text-align:center;padding:6px;box-shadow:inset 0 0 0 3px var(--cert-bg),inset 0 0 0 4px var(--cert-line)}
.cert b{font:600 9px/1.1 var(--display);color:var(--cert-ink)} .cert span{font-size:7px;color:var(--cert-ink)} .cert i{width:16px;height:16px;border-radius:50%;background:var(--gold)}
.meter{height:8px;border-radius:4px;background:var(--accent-soft);overflow:hidden} .meter span{display:block;height:100%;background:var(--accent);border-radius:4px}
.tick{display:flex;gap:8px;align-items:flex-start;font-size:13.5px} .tick .ic{margin-top:2px}
.tick.done{color:var(--muted)} .tick.done .ic{color:var(--ok)}
/* messages */
.msg{display:grid;grid-template-columns:330px minmax(0,1fr);height:min(720px,calc(100dvh - 190px));min-height:480px;overflow:hidden}
.mlist{border-right:1px solid var(--line);overflow-y:auto;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-bottom:2px solid transparent;background:none;padding:12px 8px;font-weight:600;cursor:pointer;color:var(--fg-2)}
.tabs button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.conv{display:flex;gap:10px;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.conv:hover,.conv[aria-current="true"]{background:var(--surface-2)}
.conv div{min-width:0;flex:1} .conv b{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.conv b small{font-weight:400;color:var(--muted);font-size:12px}
.conv p{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;align-self:center}
.req{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.req q{font-size:13.5px;color:var(--fg-2);quotes:none}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.pane-h{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.pane-h div{flex:1;min-width:0}
.thread{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.note{font-size:12.5px;color:var(--muted);text-align:center;padding:8px 12px;background:var(--surface-2);border-radius:8px}
.bub{max-width:76%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.45}
.bub small{display:block;font-size:11px;opacity:.75;margin-top:3px}
.bub.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:var(--them);border-bottom-left-radius:4px}
.compose{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-end}
.compose textarea{min-height:40px;height:40px}
.empty{display:grid;place-items:center;text-align:center;padding:40px;color:var(--muted);flex:1;gap:8px}
/* verify + admin */
.vq{display:grid;grid-template-columns:360px minmax(0,1fr);overflow:hidden;min-height:520px}
.vitem{display:flex;gap:10px;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.vitem:hover,.vitem[aria-current="true"]{background:var(--surface-2)}
.vitem div{min-width:0;flex:1} .vitem b{display:block;font-size:14px} .vitem p{font-size:13px;color:var(--fg-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px 16px;text-align:left} .kpi span{font-size:13px;color:var(--muted)} .kpi b{display:block;font-size:28px;font-weight:600;line-height:1.2}
button.kpi{cursor:pointer;font:inherit} button.kpi:hover{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.hb{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;align-items:center;min-height:30px;font-size:13.5px}
.hb-t{display:flex;align-items:center;gap:8px}
.hb-t i{display:block;height:16px;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.hb-t span{font-size:12.5px;color:var(--fg-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.hb:hover i{background:var(--accent-hover)}
.cols{display:flex;align-items:flex-end;gap:6px;height:180px;border-bottom:1px solid var(--line-strong);margin-top:12px;padding-top:20px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;min-width:0}
.col i{display:block;width:min(24px,70%);background:var(--accent);border-radius:4px 4px 0 0}
.col:hover i{background:var(--accent-hover)}
.col span{font-size:12px;color:var(--fg-2);margin-bottom:4px;font-variant-numeric:tabular-nums}
.col-l{display:flex;gap:6px;font-size:11.5px;color:var(--muted)} .col-l span{flex:1;text-align:center;min-width:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);background:var(--surface-2);padding:9px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.atabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.atabs button{border:0;border-bottom:2px solid transparent;background:none;padding:10px 14px;font-weight:600;color:var(--fg-2);cursor:pointer;white-space:nowrap}
.atabs button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--accent)}
/* modal, toast, tooltip */
.ovl{position:fixed;inset:0;z-index:80;background:var(--scrim);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;width:min(540px,100%);max-height:calc(100dvh - 48px);overflow:auto;box-shadow:var(--shadow)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mb{padding:20px;display:grid;gap:14px} .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--tip-bg);color:var(--tip-ink);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.tip{position:fixed;z-index:95;pointer-events:none;background:var(--tip-bg);color:var(--tip-ink);font-size:12.5px;padding:6px 9px;border-radius:6px;max-width:240px}
@media (max-width:980px){.pf,.people{grid-template-columns:1fr}.filters{position:static}.land{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
@media (max-width:760px){
  .brand span{display:none}
  .nav{position:fixed;left:0;right:0;bottom:0;height:auto;margin:0;z-index:55;background:var(--surface);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .nav button{flex:1;min-width:0;height:54px;border-bottom:0;font-size:11px}
  .nav button[aria-current="page"]{color:var(--accent)}
  .main{padding-bottom:100px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.roles{grid-template-columns:1fr}
  .msg,.vq{grid-template-columns:1fr;height:auto;min-height:0}
  .msg[data-open="1"] .mlist,.vq[data-open="1"] .vlist{display:none}
  .msg:not([data-open="1"]) .pane,.vq:not([data-open="1"]) .vdet{display:none}
  .mlist{border-right:0} .thread{min-height:50vh}
  .jrow{grid-template-columns:40px minmax(0,1fr)} .jtags{grid-column:2;justify-content:flex-start}
  .jdet{margin-left:0} .pf-head{padding:0 16px 20px} .pad{padding:16px}

function phase(p, i){
  if (i.kind === 'graduation' || (p.role === 'alumni' && i.date > p.grad+'-06')) return {k:'after', label:'After college', order:9};
  const y = ayStart(i.date) - p.adm + 1;
  return {k:'y'+y, label:ord(y)+' year', yr:ayLabel(p.adm+y-1), order:y};
}
function phases(p){
  const n = p.role === 'alumni' ? p.grad - p.adm : CUR_AY - p.adm + 1;
  const list = []; for (let y = 1; y <= n; y++) list.push({k:'y'+y, label:ord(y)+' year', yr:ayLabel(p.adm+y-1), order:y});
  if (p.role === 'alumni') list.push({k:'after', label:'After college', yr:'since '+p.grad, order:9});
  return list;
}
function relation(a, b){
  const chat = CHATS.find(c => (c.a===a && c.b===b) || (c.a===b && c.b===a)); if (chat) return {k:'chat', chat};
  const sent = REQS.find(r => r.from===a && r.to===b && r.status==='pending'); if (sent) return {k:'sent', r:sent};
  const recv = REQS.find(r => r.from===b && r.to===a && r.status==='pending'); if (recv) return {k:'recv', r:recv};
  return {k:'none'};
}

function cols(data, labelAll){
  const max = Math.max(1, ...data.map(d => d.v)); const mi = data.findIndex(d => d.v === max);
  return `<div class="cols">${data.map((d,i) => `<div class="col" data-tip="${esc(d.tip)}">${labelAll || i===mi || i===data.length-1 ? `<span>${fmtN(d.v)}</span>` : ''}<i style="height:calc((100% - 22px) * ${(d.v/max).toFixed(3)})"></i></div>`).join('')}</div>
    <div class="col-l">${data.map(d => `<span>${esc(d.l)}</span>`).join('')}</div>`;
}
function hbars(data, total){
  const max = Math.max(1, ...data.map(d => d.v));
  return data.map(d => `<div class="hb" data-tip="${esc(d.l)}: ${fmtN(d.v)} of ${fmtN(total)}"><span>${esc(d.l)}</span><div class="hb-t"><i style="width:calc((100% - 96px) * ${(d.v/max).toFixed(3)})"></i><span>${fmtN(d.v)} · ${total?Math.round(d.v/total*100):0}%</span></div></div>`).join('');
}
const REPORTS = {
  progression:{label:'NAAC · Student progression', year:'Graduating batch', desc:'Outgoing students who were placed, went for higher studies or research, or cleared a competitive exam.'},
  awards:{label:'NAAC · Awards and medals', year:'Academic year', desc:'Awards at university, state, national and international level, with the verifier for each.'},
  nirf:{label:'NIRF · Graduation outcomes', year:'Graduating batch', desc:'Graduates, placements and higher studies by department.'}
};
function reportData(){
  const y = Number(S.ryear), rs = regs();
  if (S.rtype === 'progression') {
    const rows = rs.filter(r => r.role==='alumni' && r.grad===y);
    return {head:['Name','College ID','Department','Outcome'], rows:rows.map(r => [r.name, r.cid, DEPTS[r.dept].name, r.outcome]),
      sum:OUTCOMES.map(o => [o, rows.filter(r => r.outcome===o).length])};
  }
  if (S.rtype === 'awards') {
    const rows = allAch().filter(a => a.status==='verified' && a.level!=='College' && ayStart(a.date)===y);
    return {head:['Name','College ID','Department','Award','Level','Month','Verified by'], rows:rows.map(a => [a.name, a.cid, DEPTS[a.dept].name, a.title, a.level, fmtMonth(a.date), a.ver]),
      sum:LEVELS.slice(1).map(l => [l, rows.filter(a => a.level===l).length])};
  }
  const rows = Object.keys(DEPTS).filter(k => !S.adept || k===S.adept).map(k => { const g = REG.filter(r => r.dept===k && r.role==='alumni' && r.grad===y);
    const pl = g.filter(r => r.outcome==='Job').length, hs = g.filter(r => r.outcome==='Higher studies' || r.outcome==='Research').length;
    return [DEPTS[k].name, g.length, pl, hs, g.length?Math.round(pl/g.length*100)+'%':'—', g.length?Math.round(hs/g.length*100)+'%':'—']; });
  return {head:['Department','Graduates','Placed','Higher studies','% placed','% higher studies'], rows, sum:[['Graduates',rows.reduce((n,r) => n+r[1],0)],['Placed',rows.reduce((n,r) => n+r[2],0)],['Higher studies',rows.reduce((n,r) => n+r[3],0)]]};
}

  const rep = REPORTS[S.rtype], d = reportData();

  if (!yrs.includes(Number(S.ryear))) S.ryear = String(yrs[0]);
  return `<div class="stack" style="gap:16px">
    <section class="card pad stack"><div class="row" style="align-items:flex-end">
      <div class="fld" style="flex:2;min-width:220px"><label for="rtype">Report</label><select id="rtype" data-m="rtype">${Object.entries(REPORTS).map(([k,r]) => `<option value="${k}" ${S.rtype===k?'selected':''}>${r.label}</option>`).join('')}</select></div>
      <div class="fld" style="flex:1;min-width:150px"><label for="ryear">${rep.year}</label><select id="ryear" data-m="ryear">${yrs.map(y => `<option value="${y}" ${S.ryear===String(y)?'selected':''}>${S.rtype==='awards'?ayLabel(y):y}</option>`).join('')}</select></div>
      <button class="btn btn-p" data-act="csv">${icon('copy',16)}Copy as CSV</button></div>
      <p class="muted small">${rep.desc} Only verified records are counted. The full build also exports PDF and Excel.</p></section>
    <div class="kpis">${d.sum.map(([l,v]) => `<div class="card kpi"><span>${l}</span><b>${fmtN(v)}</b></div>`).join('')}</div>
    <div class="tw"><table><thead><tr>${d.head.map((h,i) => `<th class="${typeof d.rows[0]?.[i]==='number'?'n':''}">${h}</th>`).join('')}</tr></thead>
      <tbody>${d.rows.slice(0,40).map(r => `<tr>${r.map(c => `<td class="${typeof c==='number'?'n':''}">${esc(c)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${d.head.length}" class="muted">No verified records for this selection.</td></tr>`}</tbody></table></div>
    ${d.rows.length > 40 ? `<p class="muted small">Showing 40 of ${fmtN(d.rows.length)} rows. Copy as CSV to get all of them.</p>` : ''}
  </div>`;
}
function aRecords(){
  const rs = regs().slice().reverse().slice(0,60);
  return `<div class="stack" style="gap:12px"><div class="between"><p class="muted small">Showing 60 of ${fmtN(regs().length)} records. Replaces the physical register.</p>
    <div class="row"><button class="btn btn-sm" data-act="toast" data-t="In the full build this opens a CSV or Excel import with duplicate checks.">Import register (CSV)</button></div></div>
    <div class="tw"><table><thead><tr><th>College ID</th><th>Name</th><th>Role</th><th>Department</th><th>Batch</th><th>Status now</th><th>Record</th></tr></thead><tbody>
    ${rs.map(r => `<tr><td class="mono">${r.cid}</td><td>${r.featured?`<button class="link" data-act="profile" data-id="${r.featured}">${esc(r.name)}</button>`:esc(r.name)}</td><td>${r.role==='alumni'?'Alumni':'Student'}</td><td>${DEPTS[r.dept].name}</td><td>${r.adm}–${String(r.grad||r.adm+3).slice(2)}</td><td>${esc(r.outcome||'Studying')}</td><td>${r.record==='Verified'?stPill('verified'):'<span class="st st-warn">'+icon('info',14)+'Needs update</span>'}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}
function aAudit(){
  return `<div class="tw"><table><thead><tr><th>When</th><th>Who</th><th>What</th></tr></thead><tbody>${AUDIT.map(a => `<tr><td style="white-space:nowrap">${esc(a.at)}</td><td>${esc(a.who)}</td><td>${esc(a.what)}</td></tr>`).join('')}</tbody></table></div>`;
}

/* modals */
function renderModal(){
  const root = document.getElementById('modal');
  if (!S.modal) { root.innerHTML = ''; return; }
  const m = S.modal; let h = '';
  if (m.type === 'ask') { const p = get(m.id);
    h = `<form data-form="ask"><div class="mh"><h2 class="h2" id="mt">Request to chat with ${esc(first(p.name))}</h2><button type="button" class="btn btn-g btn-sm" data-act="close" aria-label="Close">${icon('x',16)}</button></div>
      <div class="mb"><div class="fld"><label for="ask-p">What is it about?</label><select id="ask-p">${['Mentorship','Career advice','Resume review','Internship / referral','Higher studies advice','Project collaboration'].map(x => `<option>${x}</option>`).join('')}</select></div>
      <div class="fld"><label for="ask-n">Short note</label><textarea id="ask-n" maxlength="300" required placeholder="Say who you are and what you’d like to ask."></textarea></div>
      <p class="muted small">${icon('lock',14)} ${esc(first(p.name))} sees your profile and this note. The chat opens only if they accept.</p></div>
      <div class="mf"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn btn-p" type="submit">Send request</button></div></form>`;
  } else if (m.type === 'add') {
    h = `<form data-form="add"><div class="mh"><h2 class="h2" id="mt">Add to your journey</h2><button type="button" class="btn btn-g btn-sm" data-act="close" aria-label="Close">${icon('x',16)}</button></div>
      <div class="mb">
        <div class="fld"><label for="f-kind">Type</label><select id="f-kind">${['achievement','exam','research','society','position','event','project','internship'].map(k => `<option value="${k}">${KIND_LABEL[k]}</option>`).join('')}</select></div>
        <div class="fld"><label for="f-title">Title</label><input id="f-title" type="text" required placeholder="For example: 2nd prize, inter-college debate"></div>
        <div class="row" style="align-items:flex-start"><div class="fld" style="flex:1;min-width:150px"><label for="f-date">Month</label><input id="f-date" type="month" required max="${today().slice(0,7)}"></div>
        <div class="fld" style="flex:1;min-width:150px"><label for="f-level">Level</label><select id="f-level">${LEVELS.map(l => `<option>${l}</option>`).join('')}</select></div></div>
        <div class="fld"><label for="f-org">Organised by</label><input id="f-org" type="text" placeholder="Event, society or organisation"></div>
        <div class="fld"><label for="f-file">Proof: certificate</label><input id="f-file" type="file" accept=".pdf,image/*"></div>
        <div class="fld"><label for="f-link">Or a link</label><input id="f-link" type="url" placeholder="https://"></div>
        <p class="muted small">College-level items go to your society’s faculty coordinator. Everything else goes to your department moderator.</p></div>
      <div class="mf"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn btn-p" type="submit">Send for verification</button></div></form>`;
  } else if (m.type === 'report') {
    h = `<form data-form="report"><div class="mh"><h2 class="h2" id="mt">Report incorrect information</h2><button type="button" class="btn btn-g btn-sm" data-act="close" aria-label="Close">${icon('x',16)}</button></div>
      <div class="mb"><div class="fld"><label for="r-why">Reason</label><select id="r-why"><option>Achievement looks wrong</option><option>Wrong batch or department</option><option>Fake profile</option><option>Something else</option></select></div>
      <div class="fld"><label for="r-txt">Details</label><textarea id="r-txt" required></textarea></div><p class="muted small">IQAC reviews every report. The person isn’t told who reported it.</p></div>
      <div class="mf"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn btn-p" type="submit">Send to IQAC</button></div></form>`;
  } else if (m.type === 'csv') {
    h = `<div class="mh"><h2 class="h2" id="mt">Report as CSV</h2><button class="btn btn-g btn-sm" data-act="close" aria-label="Close">${icon('x',16)}</button></div>
      <div class="mb"><p class="small">Copying was blocked, so select all of this and copy it.</p><textarea id="csv-out" readonly style="min-height:240px;font:12px var(--mono)">${esc(m.text)}</textarea></div>`;
  }
  root.innerHTML = `<div class="ovl" data-act="close-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">${h}</div></div>`;
  const f = root.querySelector('textarea, input, select'); if (f) f.focus();
}

/* ---------------- actions ---------------- */
function go(v){ if (v === 'me') { S.back = S.view === 'profile' ? S.back : S.view; openProfile(S.me); return; } S.view = v; S.vmode = null; render(); window.scrollTo(0,0); }
function openProfile(id){
  if (S.view !== 'profile') S.back = S.view;
  S.prof = id; S.view = 'profile'; S.jf = 'all'; S.jph = '';
  const p = get(id); const last = p.items.filter(i => i.ach && (i.status==='verified' || id===S.me)).pop();
  S.open = new Set(last ? [last.id] : []); render(); window.scrollTo(0,0);
}
function startChat(r){
  r.status = 'accepted';
  const c = {id:'c'+(CHATS.length+1), a:r.from, b:r.to, purpose:r.purpose, started:today(), unread:{}, msgs:[{from:r.from, text:r.note, at:'Today, '+clock()}]};
  if (r.from === S.me) { c.msgs.push({from:r.to, text:'Hi! Happy to help. What would you like to start with?', at:'Today, '+clock()}); c.unread[S.me] = true; }
  CHATS.unshift(c); return c;
}
const ACT = {
  noop(){},
  login(el){ const role = el.dataset.role; S.role = role; S.me = DEMO[role]; S.chat = null; S.vsel = null; S.mtab = 'chats';
    S.view = role==='admin' ? 'admin' : role==='faculty' ? 'verify' : 'people';
    if (role === 'student' || role === 'alumni') { S.back = 'people'; openProfile(S.me); } else { render(); window.scrollTo(0,0); } },
  logout(){ S.me = null; S.role = null; render(); },
  home(){ go(S.role==='admin'?'admin':S.role==='faculty'?'verify':'me'); },
  nav(el){ go(el.dataset.v); },
  profile(el){ openProfile(el.dataset.id); },
  path(el){ S.path = S.path === el.dataset.k ? '' : el.dataset.k; refresh('presults'); },
  phase(el){ S.jph = S.jph === el.dataset.k ? '' : el.dataset.k; render(); },
  jf(el){ S.jf = el.dataset.k; render(); },
  item(el){ const id = el.dataset.id; S.open.has(id) ? S.open.delete(id) : S.open.add(id); render(); },
  ask(el){ S.modal = {type:'ask', id:el.dataset.id}; renderModal(); },
  add(){ S.modal = {type:'add'}; renderModal(); },
  report(el){ S.modal = {type:'report', id:el.dataset.id}; renderModal(); },
  close(){ S.modal = null; renderModal(); },
  'close-bg'(el, e){ if (e.target === el) ACT.close(); },
  copy(el){ const t = 'https://'+el.dataset.t; navigator.clipboard?.writeText(t).then(() => toast('Profile link copied'), () => toast(t)) ?? toast(t); },
  requests(){ S.view = 'messages'; S.mtab = 'requests'; S.chat = null; render(); },
  chat(el){ S.view = 'messages'; S.chat = el.dataset.id; S.mtab = 'chats'; const c = CHATS.find(x => x.id === S.chat); if (c) c.unread[S.me] = false; render(); scrollThread(); },
  unchat(){ S.chat = null; render(); },
  mtab(el){ S.mtab = el.dataset.k; render(); },
  accept(el){ const r = REQS.find(x => x.id === el.dataset.id); const c = startChat(r); const o = get(r.from===S.me?r.to:r.from);
    S.chat = c.id; S.mtab = 'chats'; c.unread[S.me] = false; render(); scrollThread(); toast(r.from===S.me ? `${first(o.name)} accepted your request` : `Chat started with ${first(o.name)}`); },
  decline(el){ const r = REQS.find(x => x.id === el.dataset.id); r.status = 'declined'; render(); toast('Request declined. They won’t see a reason.'); },
  vsel(el){ S.vsel = el.dataset.id; S.vmode = null; render(); },
  vback(){ S.vsel = null; render(); },
  vmode(el){ S.vmode = el.dataset.k || null; render(); const t = document.getElementById('vnote'); if (t) t.focus(); },
  vdo(el){
    const q = QUEUE.find(x => x.id === S.vsel), k = el.dataset.k, note = (document.getElementById('vnote')||{}).value || '';
    if (k !== 'approve' && !note.trim()) { toast(k==='reject' ? 'Add a reason so the student knows what to fix.' : 'Say what extra information you need.'); return; }
    const t = qText(q), ver = S.role==='admin' ? IQ : q.route;
    if (k === 'approve') { q.status = 'done';
      if (q.item) { q.item.status = 'verified'; q.item.ver = ver; q.item.verOn = today(); }
      if (q.kind === 'registration') REG.push({name:q.data.name, role:'alumni', dept:'CH', adm:2016, grad:2019, cid:'16CH'+(++seq), outcome:'Not reported', record:'Verified', active:true});
      audit(`Approved “${t.title}” for ${t.name}`); toast(`Approved. ${first(t.name)} has been notified.`);
    } else if (k === 'reject') { q.status = 'done'; if (q.item) { q.item.status = 'rejected'; q.item.reason = note; } audit(`Rejected “${t.title}”: ${note}`); toast('Rejected. The reason was sent.'); }
    else { q.status = 'info'; audit(`Asked ${t.name} for more information`); toast('Request sent. The item stays in your inbox.'); }
    S.vmode = null; const next = myQueue().find(x => x.status === 'pending'); S.vsel = next ? next.id : null; render();
  },
  atab(el){ S.atab = el.dataset.k; render(); },
  remind(el){ audit(`Sent status reminders to ${el.dataset.n} alumni`); toast(`Reminder sent to ${el.dataset.n} alumni`); },
  toast(el){ toast(el.dataset.t); },
  csv(){
    const d = reportData(), cell = v => /[",\n]/.test(String(v)) ? '"'+String(v).replace(/"/g,'""')+'"' : String(v);
    const text = [d.head, ...d.rows].map(r => r.map(cell).join(',')).join('\n');
    audit(`Exported ${REPORTS[S.rtype].label}, ${S.ryear} (CSV)`);
    const fail = () => { S.modal = {type:'csv', text}; renderModal(); };
    try { navigator.clipboard.writeText(text).then(() => toast(`Copied ${d.rows.length} rows as CSV`), fail); } catch (e) { fail(); }
  }
};
function scrollThread(){ const t = document.getElementById('thread'); if (t) t.scrollTop = t.scrollHeight; }
function refresh(id){ const el = document.getElementById(id); if (!el) return render(); el.innerHTML = id === 'presults' ? peopleResults() : adminRegion(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.m || el.type === 'checkbox' || el.tagName === 'SELECT') return;
  S[el.dataset.m] = el.value; refresh('presults');
});
document.addEventListener('change', e => {
  const el = e.target; if (!el.dataset || !el.dataset.m) return;
  if (el.type === 'checkbox') { S[el.dataset.m] = el.checked; refresh('presults'); }
  else if (el.tagName === 'SELECT') { S[el.dataset.m] = el.value; refresh(el.dataset.m.startsWith('p') ? 'presults' : 'aregion'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.modal) ACT.close();
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'msg-in') { e.preventDefault(); e.target.form.requestSubmit(); }
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target.dataset.form; const v = id => document.getElementById(id).value.trim();
  if (f === 'send') {
    const text = v('msg-in'); if (!text) return; const c = CHATS.find(x => x.id === S.chat);
    c.msgs.push({from:S.me, text, at:'Today, '+clock()}); render(); scrollThread(); document.getElementById('msg-in').focus();
    const other = c.a === S.me ? c.b : c.a; const replies = get(other).role === 'alumni'
      ? ['Thanks for the message! Give me a day and I’ll reply properly.','Good question. Start early and keep proof of everything you do.','Happy to help. Can we do a 15-minute call on Saturday?']
      : ['Thank you so much, that really helps!','Sure, I’ll share it by tonight.','Got it. I’ll update you after I try this.'];
    setTimeout(() => { c.msgs.push({from:other, text:replies[c.msgs.length % 3], at:'Today, '+clock()}); if (S.view==='messages' && S.chat===c.id) { render(); scrollThread(); } }, 1400);
  } else if (f === 'ask') {
    REQS.push({id:'q'+(REQS.length+1), from:S.me, to:S.modal.id, purpose:v('ask-p'), note:v('ask-n'), on:today(), status:'pending'});
    const n = first(get(S.modal.id).name); S.modal = null; render(); toast(`Request sent to ${n}`);
  } else if (f === 'add') {
    if (!document.getElementById('f-file').files.length && !v('f-link')) { toast('Add a certificate or a link as proof.'); return; }
    const p = get(S.me), level = v('f-level'), kind = v('f-kind');
    const route = p.role === 'alumni' ? IQ : level === 'College' ? coord(p.dept) : mod(p.dept);
    const it = I('u'+Date.now(), v('f-date'), kind, v('f-title'), v('f-org'), ['achievement','exam','research','event'].includes(kind) ? level : null, null,
      {status:'pending', subOn:today(), route, personId:p.id, proof:{type:v('f-link')?'link':'cert', label:v('f-link')||document.getElementById('f-file').files[0].name}});
    p.items.push(it); QUEUE.push({id:'v'+QUEUE.length, kind:'achievement', personId:p.id, item:it, route, on:today(), status:'pending'});
    S.modal = null; S.open.add(it.id); render(); toast(`Sent to ${route.name} for verification`);
  } else if (f === 'report') {
    QUEUE.push({id:'v'+QUEUE.length, kind:'report', personId:S.modal.id, reason:v('r-why'), text:v('r-txt'), route:IQ, on:today(), status:'pending'});
    S.modal = null; renderModal(); toast('Sent to IQAC for review');
  }
});
const tip = document.getElementById('tip');
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (!el) { tip.hidden = true; return; } tip.textContent = el.dataset.tip; tip.hidden = false; });
document.addEventListener('mousemove', e => { if (tip.hidden) return; tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8)+'px'; tip.style.top = (e.clientY + 14)+'px'; });

render();
})();
</script>
